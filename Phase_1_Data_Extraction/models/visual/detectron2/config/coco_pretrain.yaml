_BASE_: "base.yaml"

MODEL:
  WEIGHTS: "detectron2://COCO-Detection/faster_rcnn_R_50_FPN_3x/137849458/model_final_280758.pkl"
  MASK_ON: False
  RESNETS:
    DEPTH: 50
    STRIDE_IN_1X1: False
  FPN:
    IN_FEATURES: ["res2", "res3", "res4", "res5"]
  ANCHOR_GENERATOR:
    SIZES: [[32], [64], [128], [256], [512]]
    ASPECT_RATIOS: [[0.5, 1.0, 2.0]]
  RPN:
    IN_FEATURES: ["p2", "p3", "p4", "p5", "p6"]
    PRE_NMS_TOPK_TRAIN: 2000
    PRE_NMS_TOPK_TEST: 1000
    POST_NMS_TOPK_TRAIN: 1000
    POST_NMS_TOPK_TEST: 500
    SMOOTH_L1_BETA: 0.1111111111111111
  ROI_HEADS:
    NAME: "StandardROIHeads"
    IN_FEATURES: ["p2", "p3", "p4", "p5"]
    NUM_CLASSES: 80  # COCO classes
    SCORE_THRESH_TEST: 0.05
    NMS_THRESH_TEST: 0.5
  ROI_BOX_HEAD:
    NAME: "FastRCNNConvFCHead"
    NUM_FC: 2
    POOLER_RESOLUTION: 7
    POOLER_SAMPLING_RATIO: 0
    POOLER_TYPE: "ROIAlignV2"
  ROI_BOX_CNN:
    SMOOTH_L1_BETA: 0.1111111111111111

SOLVER:
  IMS_PER_BATCH: 2  # Reduced for 4GB GPU
  BASE_LR: 0.0005   # Lower LR for fine-tuning
  STEPS: (3000, 4000)
  MAX_ITER: 5000    # Fewer iterations for pre-trained model
  WARMUP_ITERS: 500
  WARMUP_FACTOR: 0.001
  WARMUP_METHOD: "linear"
  GAMMA: 0.1
  CHECKPOINT_PERIOD: 1000
  LR_SCHEDULER_NAME: "WarmupMultiStepLR"
  OPTIMIZER: "SGD"
  MOMENTUM: 0.9
  WEIGHT_DECAY: 0.0001

INPUT:
  MIN_SIZE_TRAIN: (640, 672, 704, 736, 768, 800)
  MIN_SIZE_TEST: 800
  MAX_SIZE_TRAIN: 1333
  MAX_SIZE_TEST: 1333
  FORMAT: "RGB"
  CROP:
    ENABLED: False
  COLOR_AUGMENTATION: True
  RANDOM_FLIP: "horizontal"

DATASETS:
  TRAIN: ("coco_2017_train",)
  TEST: ("coco_2017_val",)

DATALOADER:
  NUM_WORKERS: 2
  ASPECT_RATIO_GROUPING: True
  FILTER_EMPTY_ANNOTATIONS: True

TEST:
  EVAL_PERIOD: 500
  DETECTIONS_PER_IMAGE: 100

OUTPUT_DIR: "./output/coco_finetune"