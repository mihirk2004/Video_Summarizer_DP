# Phase 3: BART Summarization + FLAN-T5 Configuration

# BART Fine-tuning
bart:
  model_name: "facebook/bart-large-cnn"
  max_input_length: 1024
  max_target_length: 350                  # ← matched to FLAN-T5 output length
  min_target_length: 30
  num_beams: 4
  length_penalty: 2.0
  no_repeat_ngram_size: 3
  learning_rate: 1.0e-5                   # ← lowered from 2e-5 to reduce overfitting
  lora_learning_rate: 3.0e-4              # ← LoRA uses higher LR (fewer trainable params)
  lora_adapter_learning_rate: 5.0e-5      # ← when continuing from pre-trained adapter (gentler)
  batch_size: 2                           # Small for GPU memory
  gradient_accumulation_steps: 4          # Effective batch = 8
  epochs: 10                              # ← increased from 5
  warmup_ratio: 0.1
  weight_decay: 0.01
  fp16: true
  gradient_checkpointing: true
  early_stopping_patience: 5             # ← increased from 3
  entity_loss_weight: 1.5                 # Set to 1.0 to disable entity-aware loss
  label_smoothing: 0.1                    # ← NEW: reduces overfitting
  special_tokens:
    - "[TRANSCRIPT]"
    - "[VISUAL]"
    - "[EQUATION]"
    - "[DIAGRAM]"
    - "[CODE]"
    - "[SLIDE]"
    - "[GRAPH]"

# FLAN-T5 Pseudo-summary Generation
flan_t5:
  model_name: "google/flan-t5-large"      # ← updated from flan-t5-base
  max_input_length: 512
  max_target_length: 350                  # ← increased from 150
  min_target_length: 50                   # ← NEW: ensures minimum output length
  num_beams: 4                            # ← NEW: beam search (deterministic)
  length_penalty: 1.5                     # ← NEW: favor longer outputs
  batch_size: 4
  min_quality_score: 0.5                  # ← raised from 0.3
  min_entity_coverage: 0.2               # ← lowered: concise summaries can't hit 0.4

# Data Preparation
data_prep:
  min_segment_words: 50
  max_segment_words: 800
  fallback_chunk_size: 400               # Words per chunk when no topic boundaries
  summary_review_samples: 20
  visual_tags:
    - "Equations"
    - "Diagrams"
    - "Computer_Code"
    - "Graph/chart"
    - "Molecular_Reaction"
    - "Question"
    - "Answer of question"

# Phase 4: Multimodal Fusion & Document Generation

# CLIP Fine-tuning (contrastive learning on lecture text-image pairs)
clip:
  model_name: "openai/clip-vit-base-patch32"
  embed_dim: 512
  image_size: 224
  lora_r: 8
  lora_alpha: 16
  lora_target_modules: ["q_proj", "v_proj"]
  learning_rate: 1.0e-4
  weight_decay: 0.01
  batch_size: 16                             # Colab T4 can handle 16
  gradient_accumulation: 2                   # effective batch = 32
  epochs: 10
  warmup_ratio: 0.1
  early_stopping_patience: 3
  temperature: 0.07                          # InfoNCE temperature
  max_text_length: 77                        # CLIP tokenizer limit
  hard_negatives_per_sample: 3               # in-batch + hard negatives

# CLIP+BART Prefix Fusion Model
fusion:
  max_images_per_segment: 3                  # pad/truncate frames per segment
  bart_base: "facebook/bart-large-cnn"       # or path to fine-tuned checkpoint
  use_finetuned_bart: true                   # use models/text/bart_summarizer/best_model
  bart_embed_dim: 1024
  clip_embed_dim: 512
  projection_hidden_dim: 768                 # intermediate projection dim
  projection_dropout: 0.1
  learning_rate: 2.0e-5                      # for projection layer
  lora_learning_rate: 1.0e-4                 # for BART LoRA adapters
  lora_r: 8
  lora_alpha: 16
  lora_target_modules: ["q_proj", "v_proj"]
  batch_size: 4                              # Colab T4 16GB
  gradient_accumulation: 4                   # effective batch = 16
  epochs: 10
  warmup_ratio: 0.1
  early_stopping_patience: 4
  fp16: true
  gradient_checkpointing: true
  max_input_length: 1024
  max_target_length: 350
  num_beams: 4
  no_repeat_ngram_size: 3
  length_penalty: 2.0
  label_smoothing: 0.1
  freeze_bart_embeddings: true               # only train projection + LoRA

# LLaVA LoRA Fine-tuning
llava:
  model_name: "llava-hf/llava-1.5-7b-hf"
  load_4bit: true
  lora_r: 16
  lora_alpha: 32
  lora_target_modules: ["q_proj", "v_proj", "k_proj"]
  learning_rate: 2.0e-4
  batch_size: 2
  gradient_accumulation: 4
  epochs: 3
  warmup_ratio: 0.05
  max_new_tokens: 256

# Document Generation
document:
  output_dir: "results/documents"
  formats: ["pdf", "markdown", "html"]
  template_dir: "templates"
  max_image_width: 600
  include_timestamps: true
  include_frame_thumbnails: true
  thumbnail_quality: 85
  pdf_engine: "pdflatex"                     # or "xelatex" for unicode
  mathjax_cdn: "https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"

# Multimodal Data Preparation
multimodal_data:
  timestamp_buffer: 5.0                      # seconds buffer around segment boundaries
  min_clip_score: 0.15                       # minimum CLIP similarity to keep a frame
  max_frames_per_segment: 5                  # max candidate frames before top-K selection
  visually_aware_summaries: true             # generate visual-context target summaries
  caption_categories:
    - "Equation"
    - "Diagrams"
    - "Computer_Code"
    - "Graph_Chart"
    - "Table"
    - "Flow_diagram"
    - "Slide_Presentation"
    - "Question"
  skip_categories:
    - "Instructor_Writing"
